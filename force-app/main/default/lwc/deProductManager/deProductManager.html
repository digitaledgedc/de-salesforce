                                                                                                        <template lwc:if={kv.isEditing}>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dUSD} data-ccy="USD" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="0.01" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dJPY} data-ccy="JPY" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="1" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dSGD} data-ccy="SGD" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="0.01" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dHKD} data-ccy="HKD" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="0.01" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dIDR} data-ccy="IDR" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="1" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dKRW} data-ccy="KRW" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="1" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dCNY} data-ccy="CNY" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="0.01" /></td>
                                                                                                            <td class="dpm-tier-ccy-cell"><input type="number" class="dpm-tier-ccy-input" value={kv.dPHP} data-ccy="PHP" onchange={handleKvaDraftChange} onkeydown={handleVariantKeydown} step="0.01" /></td>
                                                                                                            <td class="dpm-tier-action-cell">
                                                                                                                <button class="dpm-tier-save" onclick={handleVariantSave} disabled={_savingVariant}>&#10003;</button>
                                                                                                                <button class="dpm-tier-cancel" onclick={handleVariantCancel} disabled={_savingVariant}>&#10005;</button>
                                                                                                            </td>
                                                                                                        </template>
                                                                                                        <template lwc:else>
                                                                                                            <td class="dpm-tier-ccy-cell">{kv.priceUSD}</td>
                                                                                                            <td class="dpm-tier-ccy-cell">{kv.priceJPY}</td>

                                    </template>
                                    <template lwc:if={detailData.approvalNotes}>
                                        <div class="dpm-panel-field dpm-panel-field_full">
                                            <span class="dpm-panel-field-label">Notes</span>
                                            <span class="dpm-panel-field-desc">{detailData.approvalNotes}</span>
                                        </div>
                                    </template>
                                </div>

                                <!-- Products requested section -->
                                <div class="dpm-panel-section-title">
                                    Products Requested
                                    <span class="dpm-panel-section-count">{detailData.lines.length}</span>
                                </div>

                                <template lwc:if={detailData.lines.length}>
                                    <table class="slds-table slds-table_cell-buffer dpm-panel-table">
                                        <thead>
                                            <tr>
                                                <th><div class="slds-truncate">Product</div></th>
                                                <th class="dpm-col-price dpm-th-right"><div class="slds-truncate">Price</div></th>
                                                <th class="dpm-col-actions-wide"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={requestPanelLines} for:item="ln">
                                                <tr key={ln.id}>
                                                    <td>
                                                        <template lwc:if={ln.isUnlinked}>
                                                            <span class="dpm-prod-unlinked">Unlinked product</span>
                                                        </template>
                                                        <template lwc:else>
                                                            <span class="dpm-prod-name">{ln.displayName}</span>
                                                        </template>
                                                        <template lwc:if={ln.productCode}>
                                                            <span class="dpm-code-text slds-m-left_x-small">{ln.productCode}</span>
                                                        </template>
                                                    </td>
                                                    <td class="dpm-col-price dpm-td-right dpm-price-cell" data-id={ln.id} onclick={handleRequestLinePriceClick}>
                                                        <template lwc:if={ln.isEditingPrice}>
                                                            <input
                                                                type="number"
                                                                class="dpm-price-input"
                                                                value={ln.draftPrice}
                                                                data-id={ln.id}
                                                                onchange={handleRequestLineDraftChange}
                                                                onkeydown={handleRequestLinePriceKeydown}
                                                                min="0" step="0.01" />
                                                        </template>
                                                        <template lwc:else>
                                                            <div class="dpm-price-view">
                                                                <span class={ln.priceTextClass}>{ln.unitPriceFormatted}</span>
                                                                <span class="dpm-price-edit-hint">
                                                                    <lightning-icon icon-name="utility:edit" size="xx-small" class="dpm-price-edit-icon"></lightning-icon>
                                                                </span>
                                                            </div>
                                                        </template>
                                                    </td>
                                                    <td class="dpm-col-actions-wide">
                                                        <template lwc:if={ln.isEditingPrice}>
                                                            <div class="dpm-row-actions dpm-row-actions_editing">
                                                                <button class="dpm-icon-btn dpm-icon-btn-success" title="Save Price" data-id={ln.id} onclick={handleSaveRequestLinePrice}>
                                                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
                                                                </button>
                                                                <button class="dpm-icon-btn" title="Cancel" onclick={handleCancelRequestLinePrice}>
                                                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                                                                </button>
                                                            </div>
                                                        </template>
                                                        <template lwc:else>
                                                            <button class="dpm-icon-btn dpm-icon-btn-warn" title="Remove Product" data-id={ln.id} onclick={handleDeleteRequestLine}>
                                                                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                                                            </button>
                                                        </template>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-body_small slds-text-color_weak slds-p-horizontal_medium slds-m-bottom_small">No products on this request yet.</p>
                                </template>

                                <!-- Add product search -->
                                <div class="dpm-panel-add-product">
                                    <div class="dpm-panel-field-label slds-m-bottom_xx-small">Add Product</div>
                                    <lightning-input
                                        type="search"
                                        label="Add product"
                                        variant="label-hidden"
                                        placeholder="Search products to add..."
                                        value={_requestLineSearch}
                                        onchange={handleRequestLineSearch}>
                                    </lightning-input>
                                    <template lwc:if={hasRequestLineSearchResults}>
                                        <div class="dpm-prod-search-dropdown">
                                            <template for:each={requestLineSearchResults} for:item="p">
                                                <button
                                                    key={p.id}
                                                    class="dpm-prod-search-item"
                                                    data-id={p.id}
                                                    data-name={p.name}
                                                    onclick={handleAddRequestLine}>
                                                    <span class="dpm-prod-name">{p.name}</span>
                                                    <span class="dpm-code-text slds-m-left_x-small">{p.productCode}</span>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                </div>

                                <!-- Approval actions -->
                                <template lwc:if={detailData.isPendingApproval}>
                                    <div class="dpm-panel-approval-section">
                                        <template lwc:if={_requestApproveInput}>
                                            <div class="dpm-panel-approval-input">
                                                <lightning-textarea
                                                    label="Approval Notes (optional)"
                                                    value={_requestNotes}
                                                    onchange={handleRequestNotesChange}
                                                    placeholder="Add notes for the requester...">
                                                </lightning-textarea>
                                                <div class="dpm-panel-approval-btns slds-m-top_x-small">
                                                    <button class="cpb-btn cpb-btn_brand" disabled={_processingApproval} onclick={handleConfirmApprove}>Confirm Approve</button>
                                                    <button class="cpb-btn cpb-btn_neutral slds-m-left_x-small" onclick={handleCancelApprovalInput}>Cancel</button>
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:elseif={_requestRejectInput}>
                                            <div class="dpm-panel-approval-input">
                                                <lightning-textarea
                                                    label="Rejection Reason"
                                                    value={_requestNotes}
                                                    onchange={handleRequestNotesChange}
                                                    placeholder="State the reason for rejection...">
                                                </lightning-textarea>
                                                <div class="dpm-panel-approval-btns slds-m-top_x-small">
                                                    <button class="cpb-btn cpb-btn_danger" disabled={_processingApproval} onclick={handleConfirmReject}>Confirm Reject</button>
                                                    <button class="cpb-btn cpb-btn_neutral slds-m-left_x-small" onclick={handleCancelApprovalInput}>Cancel</button>
                                                </div>
                                            </div>
                                        </template>
                                        <template lwc:else>
                                            <div class="dpm-panel-approval-prompt">
                                                <p class="dpm-panel-approval-prompt-text">This request is awaiting your approval.</p>
                                                <div class="dpm-panel-approval-btns">
                                                    <button class="cpb-btn cpb-btn_brand" onclick={handleShowApproveInput}>
                                                        <lightning-icon icon-name="utility:check" size="x-small" class="cpb-btn-icon"></lightning-icon>
                                                        Approve
                                                    </button>
                                                    <button class="cpb-btn cpb-btn_danger" onclick={handleShowRejectInput}>
                                                        <lightning-icon icon-name="utility:close" size="x-small" class="cpb-btn-icon"></lightning-icon>
                                                        Reject
                                                    </button>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- Open record footer -->
                                <div class="dpm-panel-footer" data-id={detailData.id} onclick={handleOpenRequest} style="cursor:pointer">
                                    <lightning-icon icon-name="utility:new_window" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span class="dpm-panel-footer-text">Open record</span>
                                </div>

                            </template>

                        </div>
                    </template>

                </div>
            </template>

        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             New Pricebook modal
             ═══════════════════════════════════════════════════════════════════ -->
        <template lwc:if={showNewPricebookModal}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                     aria-labelledby="dpm-pb-modal-heading"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container dpm-modal-wide">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleModalClose}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 id="dpm-pb-modal-heading" class="slds-modal__title">New Pricebook</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">

                        <div class="dpm-modal-grid">
                            <!-- Left column: basic details -->
                            <div class="dpm-modal-col">
                                <lightning-input
                                    label="Pricebook Name"
                                    value={newPricebookName}
                                    onchange={handleNewPricebookName}
                                    required
                                    placeholder="e.g. DE TYO1 Price Book 2026">
                                </lightning-input>
                                <div class="slds-m-top_small">
                                    <lightning-textarea
                                        label="Description"
                                        value={newPricebookDesc}
                                        onchange={handleNewPricebookDesc}
                                        placeholder="Optional description...">
                                    </lightning-textarea>
                                </div>

                                <!-- Site lookup -->
                                <div class="slds-m-top_small">
                                    <label class="dpm-field-label">Assign to Site <span class="dpm-field-label-hint">(optional)</span></label>
                                    <div class="dpm-lookup-wrap">
                                        <lightning-icon icon-name="utility:search" size="x-small" class="dpm-lookup-icon"></lightning-icon>
                                        <input
                                            type="text"
                                            class="dpm-lookup-input"
                                            placeholder="Search site codes or names..."
                                            value={siteSearchTerm}
                                            oninput={handleSiteSearchInput} />
                                        <template lwc:if={newPricebookSiteId}>
                                            <button class="dpm-lookup-clear" onclick={handleSiteClear} title="Clear">×</button>
                                        </template>
                                    </div>
                                    <template lwc:if={hasSiteResults}>
                                        <div class="dpm-lookup-results">
                                            <template for:each={siteSearchResults} for:item="site">
                                                <button key={site.id} class="dpm-lookup-result-item" data-id={site.id} onclick={handleSiteResultSelect}>
                                                    <span class="dpm-lookup-result-name">{site.name}</span>
                                                    <template lwc:if={site.currentPricebookName}>
                                                        <span class="dpm-lookup-result-sub">Current pricebook: {site.currentPricebookName}</span>
                                                    </template>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={newPricebookSiteId}>
                                        <div class="dpm-lookup-selected">
                                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                            <span>{siteSearchTerm}</span>
                                        </div>
                                    </template>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                        Linking a site means new quotes for that site automatically inherit this pricebook.
                                    </p>
                                </div>

                                <!-- Account lookup -->
                                <div class="slds-m-top_small">
                                    <label class="dpm-field-label">Assign to Account <span class="dpm-field-label-hint">(optional — Named Account pricebook)</span></label>
                                    <div class="dpm-lookup-wrap">
                                        <lightning-icon icon-name="utility:search" size="x-small" class="dpm-lookup-icon"></lightning-icon>
                                        <input
                                            type="text"
                                            class="dpm-lookup-input"
                                            placeholder="Search account names..."
                                            value={accountSearchTerm}
                                            oninput={handleAccountSearchInput} />
                                        <template lwc:if={newPricebookAccountId}>
                                            <button class="dpm-lookup-clear" onclick={handleAccountClear} title="Clear">×</button>
                                        </template>
                                    </div>
                                    <template lwc:if={hasAccountResults}>
                                        <div class="dpm-lookup-results">
                                            <template for:each={accountSearchResults} for:item="acct">
                                                <button key={acct.id} class="dpm-lookup-result-item" data-id={acct.id} onclick={handleAccountResultSelect}>
                                                    <span class="dpm-lookup-result-name">{acct.name}</span>
                                                    <template lwc:if={acct.currentPricebook}>
                                                        <span class="dpm-lookup-result-sub">Current: {acct.currentPricebook}</span>
                                                    </template>
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={newPricebookAccountId}>
                                        <div class="dpm-lookup-selected">
                                            <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                            <span>{accountSearchTerm}</span>
                                        </div>
                                    </template>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                        Links this pricebook to the account as their customer pricebook for named pricing.
                                    </p>
                                </div>
                            </div>

                            <!-- Right column: initial products -->
                            <div class="dpm-modal-col">
                                <div class="dpm-modal-section-header">
                                    <span class="dpm-modal-section-title">Initial Products</span>
                                    <span class="slds-text-body_small slds-text-color_weak">Optional</span>
                                </div>
                                <div class="dpm-lookup-wrap slds-m-top_x-small">
                                    <lightning-icon icon-name="utility:search" size="x-small" class="dpm-lookup-icon"></lightning-icon>
                                    <input
                                        type="text"
                                        class="dpm-lookup-input"
                                        placeholder="Search products to add..."
                                        value={newPbProductSearch}
                                        oninput={handleNewPbProductSearch} />
                                </div>
                                <template lwc:if={showNewPbProductDrop}>
                                    <div class="dpm-lookup-results">
                                        <template for:each={newPbProductResults} for:item="p">
                                            <button key={p.id} class="dpm-lookup-result-item" data-id={p.id} onclick={handleAddNewPbProduct}>
                                                <span class="dpm-lookup-result-name">{p.name}</span>
                                                <template lwc:if={p.productCode}>
                                                    <span class="dpm-lookup-result-sub dpm-code-text">{p.productCode}</span>
                                                </template>
                                            </button>
                                        </template>
                                    </div>
                                </template>

                                <template lwc:if={hasNewPbProducts}>
                                    <table class="slds-table slds-table_cell-buffer dpm-modal-prod-table slds-m-top_x-small">
                                        <thead>
                                            <tr>
                                                <th><div class="slds-truncate">Product</div></th>
                                                <th class="dpm-th-right dpm-col-price"><div class="slds-truncate">List Price</div></th>
                                                <th class="dpm-col-action"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={newPbProducts} for:item="p">
                                                <tr key={p.id}>
                                                    <td>
                                                        <span class="dpm-prod-name">{p.name}</span>
                                                        <template lwc:if={p.code}>
                                                            <span class="dpm-code-text slds-m-left_xx-small">{p.code}</span>
                                                        </template>
                                                    </td>
                                                    <td class="dpm-td-right dpm-col-price">
                                                        <input
                                                            type="number"
                                                            class="dpm-price-input"
                                                            value={p.unitPrice}
                                                            data-id={p.id}
                                                            onchange={handleNewPbProductPriceChange}
                                                            min="0" step="0.01" />
                                                    </td>
                                                    <td class="dpm-col-action">
                                                        <button class="dpm-icon-btn" title="Remove" data-id={p.id} onclick={handleRemoveNewPbProduct}>
                                                            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template lwc:else>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">
                                        Search and add products above. Each product will have its own list price entry in this pricebook.
                                    </p>
                                </template>
                            </div>
                        </div>

                        <template lwc:if={modalError}>
                            <p class="slds-text-color_error slds-text-body_small slds-m-top_small">{modalError}</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleModalClose}></lightning-button>
                        <lightning-button
                            label="Create Pricebook"
                            variant="brand"
                            disabled={isCreatingPricebook}
                            onclick={handleCreatePricebook}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ═══════════════════════════════════════════════════════════════════
             New Product modal
             ═══════════════════════════════════════════════════════════════════ -->
        <template lwc:if={showNewProductModal}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                     aria-labelledby="dpm-np-modal-heading"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container dpm-modal-wide">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleNewProductModalClose}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 id="dpm-np-modal-heading" class="slds-modal__title">{newProductModalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="dpm-modal-grid">
                        <div class="dpm-modal-col">
                        <lightning-input
                            label="Product Name"
                            value={newProductName}
                            onchange={handleNewProductName}
                            required
                            placeholder="Enter product name...">
                        </lightning-input>
                        <div class="slds-m-top_small">
                            <lightning-input
                                label="Product Code"
                                value={newProductCode}
                                onchange={handleNewProductCode}
                                placeholder="e.g. DE-SPACE-001">
                            </lightning-input>
                        </div>
                        <div class="slds-m-top_small">
                            <template lwc:if={hasProductFamilyOptions}>
                                <lightning-combobox
                                    label="Product Family"
                                    value={newProductFamily}
                                    options={productFamilyOptions}
                                    onchange={handleNewProductFamily}>
                                </lightning-combobox>
                            </template>
                            <template lwc:else>
                                <lightning-input
                                    label="Product Family"
                                    value={newProductFamily}
                                    onchange={handleNewProductFamily}
                                    placeholder="e.g. Space, Power, Cross Connect...">
                                </lightning-input>
                            </template>
                            <div class="dpm-manage-families-row slds-m-top_xx-small">
                                <button class="dpm-link-btn" onclick={handleManageProductFamilies}>
                                    Manage Product Families in Setup →
                                </button>
                            </div>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-combobox
                                label="Charge Type"
                                value={newProductChargeType}
                                options={chargeTypeOptions}
                                onchange={handleNewProductChargeType}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-combobox
                                label="Product Attribute"
                                value={newProductAttribute}
                                options={productAttributeOptions}
                                onchange={handleNewProductAttribute}
                                placeholder="Select attribute type...">
                            </lightning-combobox>
                        </div>
                        <template lwc:if={newProductAttribute}>
                            <div class="slds-m-top_small">
                                <lightning-textarea
                                    label="Attribute Values"
                                    value={newProductAttrValues}
                                    onchange={handleNewProductAttrValues}
                                    placeholder="Comma-separated values, e.g. 5Amps,10Amps,15Amps">
                                </lightning-textarea>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Enter attribute values separated by commas</p>
                            </div>
                            <div class="slds-m-top_small">
                                <lightning-input
                                    type="checkbox"
                                    label="Show Custom Attribute Value"
                                    checked={newProductShowCustom}
                                    onchange={handleNewProductShowCustom}>
                                </lightning-input>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Allow users to enter a custom numeric value (e.g., PUE)</p>
                            </div>
                        </template>
                        </div><!-- /left column -->
                        <div class="dpm-modal-col">
                            <lightning-dual-listbox
                                label="Available Sites"
                                source-label="All Sites"
                                selected-label="Selected Sites"
                                options={siteOptions}
                                value={newProductSites}
                                onchange={handleNewProductSites}>
                            </lightning-dual-listbox>
                            <div class="slds-m-top_small">
                                <lightning-dual-listbox
                                    label="Country Availability"
                                    source-label="Available"
                                    selected-label="Selected"
                                    options={countryOptions}
                                    value={newProductCountries}
                                    onchange={handleNewProductCountries}>
                                </lightning-dual-listbox>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Leave both empty for Global availability</p>
                            </div>
                            <!-- SFDC-366: same control as the detail-panel Edit Product modal.
                                 Shares the allowedUomOptions getter; the product's own
                                 Unit of Measure is always offered and is not listed here. -->
                            <div class="slds-m-top_small">
                                <lightning-dual-listbox
                                    label="Allowed UoM"
                                    source-label="Available"
                                    selected-label="Allowed on quote lines"
                                    options={allowedUomOptions}
                                    value={newProductAllowedUom}
                                    onchange={handleNewProductAllowedUom}
                                    field-level-help="Extra units a rep can choose for this product on a quote line. The product's own Unit of Measure is always available.">
                                </lightning-dual-listbox>
                            </div>
                            <div class="slds-m-top_small">
                                <lightning-textarea
                                    label="Description"
                                    value={newProductDesc}
                                    onchange={handleNewProductDesc}
                                    placeholder="Optional product description...">
                                </lightning-textarea>
                            </div>
                        </div><!-- /right column -->
                        </div><!-- /dpm-modal-grid -->
                        <template lwc:if={newProductError}>
                            <p class="slds-text-color_error slds-text-body_small slds-m-top_small">{newProductError}</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleNewProductModalClose}></lightning-button>
                        <lightning-button
                            label={newProductSaveLabel}
                            variant="brand"
                            disabled={isCreatingProduct}
                            onclick={handleSaveNewProduct}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ═══════════════════════════════════════════════════════════════════
             Edit Product modal
             ═══════════════════════════════════════════════════════════════════ -->
        <template lwc:if={showEditProductModal}>
            <section role="dialog" tabindex="-1" aria-modal="true"
                     aria-labelledby="dpm-ep-modal-heading"
                     class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleEditProductModalClose}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 id="dpm-ep-modal-heading" class="slds-modal__title">Edit Product</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            label="Product Name"
                            value={editProductName}
                            onchange={handleEditProductName}
                            required
                            placeholder="Product name...">
                        </lightning-input>
                        <div class="slds-m-top_small">
                            <lightning-textarea
                                label="Description"
                                value={editProductDesc}
                                onchange={handleEditProductDesc}
                                placeholder="Product description...">
                            </lightning-textarea>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-input
                                label="Attribute Type"
                                value={editProductAttrType}
                                onchange={handleEditProductAttrType}
                                placeholder="e.g. Size, Speed, Tier...">
                            </lightning-input>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-textarea
                                label="Attribute Values (comma-separated)"
                                value={editProductAttrValues}
                                onchange={handleEditProductAttrValues}
                                placeholder="e.g. Small, Medium, Large">
                            </lightning-textarea>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-input
                                type="checkbox"
                                label="Show Custom Value"
                                checked={editProductShowCustom}
                                onchange={handleEditProductShowCustom}>
                            </lightning-input>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-combobox
                                label="Capacity Assignment"
                                value={editProductCapAssign}
                                options={capacityAssignmentOptions}
                                onchange={handleEditProductCapAssign}>
                            </lightning-combobox>
                        </div>
                        <div class="slds-m-top_small">
                            <lightning-input
                                label="Unit of Measure"
                                value={editProductUom}
                                onchange={handleEditProductUom}
                                placeholder="e.g. kVA, Mbps, sqm...">
                            </lightning-input>
                        </div>
                        <!-- SFDC-366: extra units a rep may pick on a quote line.
                             The default above is always offered and need not be listed here. -->
                        <div class="slds-m-top_small">
                            <lightning-dual-listbox
                                label="Allowed UoM"
                                source-label="Available"
                                selected-label="Allowed on quote lines"
                                options={allowedUomOptions}
                                value={editProductAllowedUom}
                                onchange={handleEditProductAllowedUom}
                                field-level-help="Extra units a rep can choose for this product on a quote line. The Unit of Measure above is always available.">
                            </lightning-dual-listbox>
                        </div>
                        <template lwc:if={editProductError}>
                            <p class="slds-text-color_error slds-text-body_small slds-m-top_small">{editProductError}</p>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleEditProductModalClose}></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            disabled={isSavingProduct}
                            onclick={handleSaveEditProduct}
                            class="slds-m-left_x-small">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Create Pricing Tier Modal -->
        <template lwc:if={_showCreateTier}>
            <section class="slds-modal slds-fade-in-open slds-modal_small">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCancelCreateTier}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Add Pricing Tier</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form slds-form_stacked">
                            <div class="slds-form-element"><label class="slds-form-element__label">Product Code</label>
                                <div class="slds-form-element__control"><input type="text" class="slds-input" value={_createTierData.productCode} disabled /></div></div>
                            <div class="slds-form-element slds-m-top_small">
                                <lightning-combobox label="Attribute Value" required data-field="attributeValue"
                                    value={_createTierData.attributeValue} options={createTierAttributeOptions}
                                    onchange={handleCreateTierFieldChange} placeholder="Select attribute...">
                                </lightning-combobox>
                            </div>
                            <template lwc:if={createTierNoAttributes}>
                                <p class="slds-text-color_error slds-text-body_small slds-m-top_xx-small">Set Attribute Values on the product first (via Edit Product on Catalog tab)</p>
                            </template>
                            <div class="slds-form-element slds-m-top_small">
                                <lightning-combobox label="Site Code" data-field="siteCode"
                                    value={_createTierData.siteCode} options={createTierSiteOptions}
                                    onchange={handleCreateTierFieldChange} placeholder="Select site...">
                                </lightning-combobox>
                            </div>
                            <div class="slds-form-element slds-m-top_small">
                                <lightning-combobox label="Currency" required data-field="currencyCode"
                                    value={_createTierData.currencyCode} options={createTierCurrencyOptions}
                                    onchange={handleCreateTierFieldChange} placeholder="Select currency...">
                                </lightning-combobox>
                            </div>
                            <div class="slds-form-element"><label class="slds-form-element__label">Price *</label>
                                <div class="slds-form-element__control"><input type="number" class="slds-input" data-field="price" value={_createTierData.price} onchange={handleCreateTierFieldChange} step="0.01" min="0" /></div></div>
                            <div class="slds-form-element"><label class="slds-form-element__label">Odoo Combo ID</label>
                                <div class="slds-form-element__control"><input type="number" class="slds-input" data-field="odooComboId" value={_createTierData.odooComboId} onchange={handleCreateTierFieldChange} /></div></div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleCancelCreateTier}>Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={handleConfirmCreateTier}>Create</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Add Currency Modal -->
        <template lwc:if={_showAddCurrency}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="max-width: 420px;">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancelAddCurrency}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Add Currency</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox label="Currency" required data-field="currencyCode"
                            value={_addCurrencyData.currencyCode} options={addCurrencyOptions}
                            onchange={handleAddCurrencyFieldChange} placeholder="Select currency...">
                        </lightning-combobox>
                        <div class="slds-m-top_small">
                            <lightning-input type="number" label="Price" data-field="price"
                                value={_addCurrencyData.price} onchange={handleAddCurrencyFieldChange}
                                step="0.01" min="0">
                            </lightning-input>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCancelAddCurrency}></lightning-button>
                        <lightning-button label="Add" variant="brand" onclick={handleConfirmAddCurrency}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- Import Pricing Tiers Modal -->
        <template lwc:if={_showImportModal}>
            <section class="slds-modal slds-fade-in-open slds-modal_medium">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseImport}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Import Pricing Tiers</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template lwc:if={_importStepIsUpload}>
                            <p class="slds-m-bottom_small">Upload a CSV file with pricing tier data. <a href="javascript:void(0)" onclick={handleDownloadTierTemplate}>Download template</a></p>
                            <input type="file" accept=".csv" onchange={handleImportFileChange} />
                        </template>
                        <template lwc:if={_importStepIsPreview}>
                            <p class="slds-m-bottom_small">{_importPreview.length} rows parsed.</p>
                            <template lwc:if={_importHasErrors}>
                                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                                    <template for:each={_importErrors} for:item="err">
                                        <p key={err}>{err}</p>
                                    </template>
                                </div>
                            </template>
                            <div style="max-height:300px;overflow:auto;">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead><tr>
                                        <th>Product Code</th><th>Attribute</th><th>Site</th><th>Currency</th><th>Price</th><th>Odoo ID</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={_importPreview} for:item="row">
                                            <tr key={row.key}>
                                                <td>{row.productCode}</td><td>{row.attributeValue}</td><td>{row.siteCode}</td><td>{row.currencyCode}</td><td>{row.price}</td><td>{row.odooComboId}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleCloseImport}>Cancel</button>
                        <template lwc:if={_importStepIsPreview}>
                            <button class="slds-button slds-button_brand" onclick={handleImportConfirm}>Import {_importPreview.length} Tiers</button>
                        </template>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
