<template>
    <div class="dpm-wrap">

        <!-- ═══════════════════════════════════════════════════════════════════
             Command bar: nav + stats
             ═══════════════════════════════════════════════════════════════════ -->
        <div class="dpm-cmd-bar">
            <div class="dpm-nav">
                <button class={queueNavClass} data-view="queue" onclick={handleViewChange}>
                    Queue
                    <template lwc:if={hasPendingRequests}>
                        <span class="dpm-nav-badge">{pendingRequestCount}</span>
                    </template>
                </button>
                <button class={catalogNavClass} data-view="catalog" onclick={handleViewChange}>Catalog</button>
                <button class={pricingNavClass} data-view="pricing" onclick={handleViewChange}>Pricing</button>
            </div>
            <div class="dpm-cmd-stats">
                <span class="dpm-cmd-stat">
                    <span class="dpm-cmd-stat-val">{productCount}</span>
                    <span class="dpm-cmd-stat-lbl">Products</span>
                </span>
                <span class="dpm-cmd-stat-dot"></span>
                <span class="dpm-cmd-stat">
                    <span class="dpm-cmd-stat-val">{pricebookCount}</span>
                    <span class="dpm-cmd-stat-lbl">Pricebooks</span>
                </span>
                <button class="dpm-refresh-btn" onclick={handleRefreshAll} title="Refresh data">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 2v4h4M14.5 14v-4h-4"/><path d="M13.5 6A6 6 0 003.3 3.3L1.5 6M2.5 10a6 6 0 0010.2 2.7L14.5 10"/></svg>
                </button>
            </div>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════════
             Main row: content + optional detail panel
             ═══════════════════════════════════════════════════════════════════ -->
        <div class="dpm-main-row" onclick={handleMainRowClick}>

            <!-- ── Content area ─────────────────────────────────────────────── -->
            <div class="dpm-content">

                <!-- ═══════════════════════════════════════════════════════════
                     VIEW: QUEUE (default landing — action center)
                     ═══════════════════════════════════════════════════════════ -->
                <template lwc:if={isQueueView}>
                    <div class="dpm-tab-body dpm-queue">

                        <template lwc:if={requestsLoading}>
                            <div class="dpm-loading">
                                <lightning-spinner size="small" alternative-text="Loading requests..."></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:else>

                            <!-- Pending requests — action cards -->
                            <template lwc:if={hasPendingQueue}>
                                <div class="dpm-queue-section">
                                    <div class="dpm-queue-section-hdr">
                                        <span class="dpm-queue-section-title">Needs Attention</span>
                                        <span class="dpm-queue-badge">{pendingRequestCount}</span>
                                    </div>
                                    <div class="dpm-queue-cards">
                                        <template for:each={pendingRequests} for:item="req">
                                            <div key={req.Id} class="dpm-queue-card" data-id={req.Id} onclick={handleRequestEye}>
                                                <div class="dpm-queue-card-top">
                                                    <span class="dpm-queue-card-name">{req.Name}</span>
                                                    <div class="dpm-queue-card-status">
                                                        <span class={req.statusDotClass}></span>
                                                        <span class="dpm-queue-card-status-lbl">Pending</span>
                                                    </div>
                                                </div>
                                                <span class="dpm-queue-card-account">{req.accountName}</span>
                                                <div class="dpm-queue-card-meta">
                                                    <template lwc:if={req.hasQuote}>
                                                        <span>{req.quoteName}</span>
                                                        <span class="dpm-queue-meta-dot">·</span>
                                                    </template>
                                                    <span>{req.currencyCode}</span>
                                                    <span class="dpm-queue-meta-dot">·</span>
                                                    <span>{req.createdDateFormatted}</span>
                                                </div>
                                                <span class="dpm-queue-card-by">by {req.requestedByName}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- All clear state -->
                            <template lwc:if={isQueueClear}>
                                <div class="dpm-queue-clear">
                                    <div class="dpm-queue-clear-check">
                                        <lightning-icon icon-name="utility:check" size="medium"></lightning-icon>
                                    </div>
                                    <p class="dpm-queue-clear-h">All clear</p>
                                    <p class="dpm-queue-clear-p">No pricing requests waiting for your review.</p>
                                </div>
                            </template>

                            <!-- Recently processed -->
                            <template lwc:if={hasProcessedRequests}>
                                <div class="dpm-queue-section dpm-queue-section-recent">
                                    <div class="dpm-queue-section-hdr">
                                        <span class="dpm-queue-section-title">Recent</span>
                                    </div>
                                    <div class="dpm-queue-recent">
                                        <template for:each={processedRequests} for:item="req">
                                            <div key={req.Id} class="dpm-queue-recent-row" data-id={req.Id} onclick={handleRequestEye}>
                                                <span class={req.statusDotClass}></span>
                                                <span class="dpm-queue-recent-name">{req.Name}</span>
                                                <span class="dpm-queue-recent-account">{req.accountName}</span>
                                                <span class="dpm-queue-recent-date">{req.createdDateFormatted}</span>
                                                <span class="dpm-queue-recent-status">{req.statusShort}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={requestsError}>
                                <p class="slds-text-color_error slds-text-body_small slds-m-top_small slds-p-horizontal_medium">{requestsError}</p>
                            </template>

                        </template>

                    </div>
                </template>

                <!-- ═══════════════════════════════════════════════════════════
                     VIEW: CATALOG (progressive disclosure)
                     ═══════════════════════════════════════════════════════════ -->
                <template lwc:if={isCatalogView}>
                    <div class="dpm-tab-body">

                        <template lwc:if={productsLoading}>
                            <div class="dpm-loading">
                                <lightning-spinner size="small" alternative-text="Loading products..."></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:else>

                            <!-- Search bar + actions (always visible) -->
                            <div class="dpm-catalog-bar">
                                <div class="dpm-lookup-wrap dpm-catalog-search">
                                    <lightning-icon icon-name="utility:search" size="x-small" class="dpm-lookup-icon"></lightning-icon>
                                    <input type="text" class="dpm-lookup-input"
                                        placeholder="Search all products..."
                                        value={productSearch}
                                        oninput={handleProductSearch} />
                                    <template lwc:if={productSearch}>
                                        <button class="dpm-lookup-clear" onclick={handleClearProductSearch} title="Clear">&times;</button>
                                    </template>
                                </div>
                                <button class="cpb-btn cpb-btn_neutral" onclick={handleExportCatalog}>
                                    <svg class="cpb-btn-ic" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11v2h10v-2M8 2v8M5 7l3 3 3-3"/></svg>
                                    Export
                                </button>
                                <button class="cpb-btn cpb-btn_brand" onclick={handleNewProduct}>
                                    <span class="cpb-btn-plus">+</span> New Product
                                </button>
                            </div>

                            <!-- Category cards (always visible) -->
                            <div class="dpm-catalog-grid">
                                <template for:each={catalogCategoryGrid} for:item="cat">
                                    <button key={cat.value} class={cat.cardClass} data-value={cat.value} onclick={handleProductFamilyClick}>
                                        <span class="dpm-catalog-card-name">{cat.label}</span>
                                        <span class="dpm-catalog-card-count">{cat.count}</span>
                                        <div class="dpm-catalog-card-meta">
                                            <span class="dpm-catalog-card-active">{cat.activeCount} active</span>
                                            <template lwc:if={cat.inactiveCount}>
                                                <span class="dpm-queue-meta-dot">·</span>
                                                <span class="dpm-catalog-card-inactive">{cat.inactiveCount} inactive</span>
                                            </template>
                                        </div>
                                    </button>
                                </template>
                            </div>

                            <!-- Inline detail: products table (appears below cards) -->
                            <template lwc:if={showProductTable}>
                                <div class="dpm-inline-detail">
                                    <div class="dpm-inline-detail-bar">
                                        <template lwc:if={showCatalogDrillIn}>
                                            <span class="dpm-inline-detail-title">{activeFamily}</span>
                                            <span class="dpm-inline-detail-sub">{catalogDrillInLabel}</span>
                                        </template>
                                        <template lwc:elseif={showCatalogSearch}>
                                            <span class="dpm-inline-detail-sub">{productStatusLabel}</span>
                                        </template>
                                        <div class="dpm-inline-detail-actions">
                                            <div class="dpm-col-toggle-wrap">
                                                <button class="cpb-btn cpb-btn_neutral dpm-col-toggle-btn" onclick={handleToggleProductColumnMenu} title="Show/hide columns">
                                                    <lightning-icon icon-name="utility:table" size="x-small" class="cpb-btn-icon"></lightning-icon>
                                                    Columns
                                                </button>
                                                <template lwc:if={showProductColumnMenu}>
                                                    <div class="dpm-col-menu">
                                                        <template for:each={columnMenuProductOptions} for:item="col">
                                                            <label key={col.fieldKey} class="dpm-col-menu-item">
                                                                <input type="checkbox" checked={col.visible} data-key={col.key} onchange={handleToggleProductColumn} />
                                                                {col.label}
                                                            </label>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>

                                    <template lwc:if={hasFilteredProducts}>
                                        <div class="dpm-inline-tbl-wrap">
                                            <table class="slds-table slds-table_cell-buffer dpm-prod-table dpm-inline-tbl">
                                                <thead>
                                                    <tr class="slds-line-height_reset">
                                                        <th scope="col" class="dpm-col-row-num"></th>
                                                        <th scope="col"><div class="slds-truncate">Product Name</div></th>
                                                        <template lwc:if={showProdColCode}>
                                                            <th scope="col" class="dpm-col-code"><div class="slds-truncate">Code</div></th>
                                                        </template>
                                                        <template lwc:if={showProdColChargeType}>
                                                            <th scope="col" class="dpm-col-charge"><div class="slds-truncate">Type</div></th>
                                                        </template>
                                                        <template lwc:if={showProdColPricebooks}>
                                                            <th scope="col" class="dpm-col-num dpm-th-center"><div class="slds-truncate">Pricebooks</div></th>
                                                        </template>
                                                        <template lwc:if={showProdColStatus}>
                                                            <th scope="col" class="dpm-col-status-sm"><div class="slds-truncate">Status</div></th>
                                                        </template>
                                                        <th scope="col" class="dpm-col-actions"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={flatProducts} for:item="prod">
                                                        <tr key={prod.id} class="dpm-prod-row" onmouseenter={handleProdRowEnter} onmouseleave={handleProdRowLeave}>
                                                            <td class="dpm-row-num-cell" data-id={prod.id} onclick={handleProductEye}>
                                                                <span class="dpm-row-num">{prod.rowNum}</span>
                                                                <span class="dpm-row-eye-wrap">
                                                                    <lightning-icon icon-name="utility:preview" size="xx-small" alternative-text="View detail"></lightning-icon>
                                                                </span>
                                                            </td>
                                                            <td data-label="Name">
                                                                <span class="dpm-prod-name">{prod.name}</span>
                                                                <template lwc:if={prod.description}>
                                                                    <span class="dpm-prod-desc">{prod.description}</span>
                                                                </template>
                                                            </td>
                                                            <template lwc:if={showProdColCode}>
                                                                <td data-label="Code" class="dpm-col-code">
                                                                    <span class="dpm-code-text">{prod.productCode}</span>
                                                                </td>
                                                            </template>
                                                            <template lwc:if={showProdColChargeType}>
                                                                <td data-label="Type" class="dpm-col-charge">
                                                                    <template lwc:if={prod.hasChargeType}>
                                                                        <span class={prod.chargeTypeBadge}>{prod.chargeTypeLabel}</span>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <span class="dpm-charge-badge dpm-charge-none">—</span>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                            <template lwc:if={showProdColPricebooks}>
                                                                <td data-label="Pricebooks" class="dpm-col-num dpm-td-center">
                                                                    <template lwc:if={prod.hasEntries}>
                                                                        <button class="dpm-entry-badge dpm-entry-badge-link" data-id={prod.id} data-code={prod.productCode} onclick={handleGoToPricingForProduct} title="View pricebooks">
                                                                            {prod.entryCount}
                                                                        </button>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <span class="dpm-entry-badge dpm-entry-badge-zero">0</span>
                                                                    </template>
                                                                </td>
                                                            </template>
                                                            <template lwc:if={showProdColStatus}>
                                                                <td data-label="Status" class="dpm-col-status-sm">
                                                                    <div class="dpm-status-dot-row">
                                                                        <span class={prod.statusDotClass}></span>
                                                                        <span class="dpm-status-dot-label">{prod.statusLabel}</span>
                                                                    </div>
                                                                </td>
                                                            </template>
                                                            <td class="dpm-col-actions-wide">
                                                                <template lwc:if={prod.confirmDelete}>
                                                                    <span class="dpm-confirm-delete">
                                                                        Delete?
                                                                        <button class="dpm-confirm-yes" data-id={prod.id} onclick={handleConfirmDeleteProduct}>Yes</button>
                                                                        &nbsp;
                                                                        <button class="dpm-confirm-no" onclick={handleCancelDeleteProduct}>No</button>
                                                                    </span>
                                                                </template>
                                                                <template lwc:else>
                                                                    <div class="dpm-row-actions dpm-cat-actions">
                                                                        <button class="dpm-icon-btn" data-id={prod.id} onclick={handleEditProductFromCatalog} title="Edit Product">
                                                                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3L5 14H2v-3z"/></svg>
                                                                        </button>
                                                                        <button class="dpm-icon-btn" data-id={prod.id} onclick={handleOpenProduct} title="Open Record">
                                                                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2H2v12h12V9"/><path d="M9 1h6v6"/><path d="M15 1L8 8"/></svg>
                                                                        </button>
                                                                        <template lwc:if={prod.isActive}>
                                                                            <button class="dpm-icon-btn dpm-icon-btn-warn" data-id={prod.id} data-active={prod.isActive} onclick={handleToggleProductActive} title="Deactivate" disabled={prod.isToggling}>
                                                                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3"/><circle cx="8" cy="11" r="0.5" fill="currentColor"/></svg>
                                                                            </button>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <button class="dpm-icon-btn dpm-icon-btn-success" data-id={prod.id} data-active={prod.isActive} onclick={handleToggleProductActive} title="Activate" disabled={prod.isToggling}>
                                                                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
                                                                            </button>
                                                                        </template>
                                                                        <template lwc:if={prod.hasEntries}>
                                                                            <button class="dpm-minus-btn dpm-btn-disabled" title="Remove from pricebooks first" disabled>&#8722;</button>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <button class="dpm-minus-btn" data-id={prod.id} onclick={handleDeleteProduct} title="Delete Product">&#8722;</button>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </td>
                                                        </tr>
                                                        <template lwc:if={prod.pbListExpanded}>
                                                            <tr key={prod.pbExpandKey} class="dpm-pb-list-row">
                                                                <td colspan="10" class="dpm-pb-list-cell">
                                                                    <template lwc:if={prod.pbListLoading}>
                                                                        <span class="dpm-pb-list-loading">Loading pricebooks...</span>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <template lwc:if={prod.pbList.length}>
                                                                            <div class="dpm-pb-list">
                                                                                <template for:each={prod.pbList} for:item="pb">
                                                                                    <button key={pb.id} class="dpm-pb-list-item" data-id={pb.id} data-name={pb.name} onclick={handlePbListClick}>
                                                                                        {pb.name}
                                                                                    </button>
                                                                                </template>
                                                                            </div>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <span class="dpm-pb-list-empty">No active pricebook entries</span>
                                                                        </template>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                    </template>

                                    <template lwc:else>
                                        <div class="dpm-empty">
                                            <lightning-icon icon-name="utility:search" size="small" class="dpm-empty-ic"></lightning-icon>
                                            <template lwc:if={showCatalogSearch}>
                                                <p class="dpm-empty-h">No products match "{productSearch}"</p>
                                                <p class="dpm-empty-p">Try a different search term.</p>
                                            </template>
                                            <template lwc:else>
                                                <p class="dpm-empty-h">No products in this category</p>
                                                <p class="dpm-empty-p">All products may be filtered out or none exist yet.</p>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>

                            <template lwc:if={productsError}>
                                <p class="slds-text-color_error slds-text-body_small slds-m-top_small">{productsError}</p>
                            </template>
                        </template>

                    </div>
                </template>

                <!-- ═══════════════════════════════════════════════════════════
                     VIEW: PRICING (progressive disclosure)
                     ═══════════════════════════════════════════════════════════ -->
                <template lwc:if={isPricingView}>
                    <div class="dpm-tab-body">

                        <template lwc:if={pricebooksLoading}>
                            <div class="dpm-loading">
                                <lightning-spinner size="small" alternative-text="Loading pricebooks..."></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:else>

                            <!-- Header bar (always visible) -->
                            <div class="dpm-pricing-bar">
                                <span class="dpm-pricing-bar-label">{pricebookCount} pricebooks</span>
                                <div class="dpm-pricing-bar-actions">
                                    <button class="cpb-btn cpb-btn_neutral" onclick={handleExportPricebooks}>
                                        <lightning-icon icon-name="utility:download" size="x-small" class="cpb-btn-icon"></lightning-icon>
                                        Export
                                    </button>
                                    <button class="cpb-btn cpb-btn_brand" onclick={handleNewPricebook}>
                                        <span class="cpb-btn-plus">+</span> New Pricebook
                                    </button>
                                </div>
                            </div>

                            <!-- Type selector strip (always visible — click to expand/collapse) -->
                            <div class="dpm-type-strip">
                                <template for:each={pricingTypeCards} for:item="tc">
                                    <button key={tc.value} class={tc.typeStripClass} data-value={tc.value} onclick={handlePricebookTypeSelect}>
                                        <span class="dpm-type-chip-label">{tc.label}</span>
                                        <span class="dpm-type-chip-count">{tc.count}</span>
                                    </button>
                                </template>
                            </div>

                            <!-- Pricebook cards for selected type (below type strip) -->
                            <template lwc:if={hasPricebookTypeSelected}>

                                <!-- Pricebook card grid (hidden when one is selected) -->
                                <template lwc:if={showTypePricebookGrid}>
                                    <div class="dpm-pb-section-hdr dpm-anim-fade">
                                        <span class="dpm-pb-section-title">{selectedPricebookTypeLabel}</span>
                                        <span class="dpm-pb-section-count">{selectedTypeTotalCount}</span>
                                        <div class="dpm-pb-section-right">
                                            <template lwc:if={isSiteSpecificType}>
                                                <button class="dpm-sync-btn" onclick={handleSyncSitePricebooks} title="Sync products across all site pricebooks based on country availability">
                                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 8a7 7 0 0113-3.5M15 8a7 7 0 01-13 3.5"/><path d="M14 1v4h-4M2 15v-4h4"/></svg>
                                                    Sync Products
                                                </button>
                                            </template>
                                            <lightning-input
                                                type="search"
                                                label="Filter pricebooks"
                                                variant="label-hidden"
                                                placeholder="Filter..."
                                                value={pricebookFilter}
                                                onchange={handlePricebookFilter}
                                                class="dpm-pb-filter-input">
                                            </lightning-input>
                                        </div>
                                    </div>
                                    <div class="dpm-pbgroup-cards dpm-type-cards-grid dpm-anim-fade">
                                        <template for:each={selectedTypePricebooks} for:item="pb">
                                            <button key={pb.id} class={pb.cardClass} data-id={pb.id} onclick={handlePricebookSelect}>
                                                <div class="dpm-pbcard-top">
                                                    <span class="dpm-pbcard-name">{pb.name}</span>
                                                    <span class={pb.statusDotClass}></span>
                                                </div>
                                                <div class="dpm-pbcard-meta">
                                                    <span>{pb.entryCount} products</span>
                                                    <template lwc:if={pb.linkedTo}>
                                                        <span class="dpm-queue-meta-dot">·</span>
                                                        <span>{pb.linkedTo}</span>
                                                    </template>
                                                </div>
                                            </button>
                                        </template>
                                    </div>
                                </template>

                                <!-- Selected pricebook + View All card (inventory manager pattern) -->
                                <template lwc:if={showPricingDrillIn}>
                                    <div class="dpm-pb-section-hdr dpm-anim-fade">
                                        <span class="dpm-pb-section-title">{selectedPricebookTypeLabel}</span>
                                    </div>
                                    <div class="dpm-pbgroup-cards dpm-type-cards-grid dpm-anim-slide-right">
                                        <!-- Selected pricebook card (highlighted) -->
                                        <div class="dpm-pbcard dpm-pbcard-chosen">
                                            <div class="dpm-pbcard-top">
                                                <span class="dpm-pbcard-name">{selectedPricebook.name}</span>
                                            </div>
                                            <div class="dpm-pbcard-meta">
                                                <span>{selectedPricebook.entryCount} products</span>
                                                <template lwc:if={selectedPricebook.linkedTo}>
                                                    <span class="dpm-queue-meta-dot">-</span>
                                                    <span class="dpm-linked-label">{selectedPricebook.linkedTo}</span>
                                                </template>
                                            </div>
                                            <template lwc:if={selectedPricebookCanLink}>
                                                <div class="dpm-pbcard-link-row">
                                                    <template lwc:if={_showLinkSearch}>
                                                        <div class="dpm-link-search-wrap">
                                                            <input type="text"
                                                                class="dpm-link-text-input"
                                                                placeholder={linkSearchPlaceholder}
                                                                value={_linkSearchTerm}
                                                                oninput={handleLinkSearchInput}
                                                            />
                                                            <template lwc:if={hasLinkSearchResults}>
                                                                <div class="dpm-link-results">
                                                                    <template for:each={linkSearchResults} for:item="lr">
                                                                        <button key={lr.id} class="dpm-link-result-row" data-id={lr.id} onclick={handleLinkSelect}>
                                                                            {lr.name}
                                                                        </button>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                            <div class="dpm-link-action-row">
                                                                <button class="dpm-link-cancel" onclick={handleLinkCancel}>Cancel</button>
                                                                <template lwc:if={selectedPricebook.linkedTo}>
                                                                    <button class="dpm-link-unlink" onclick={handleUnlink}>Unlink</button>
                                                                </template>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template lwc:else>
                                                        <button class="dpm-link-btn" onclick={handleShowLinkSearch}>
                                                            <lightning-icon icon-name="utility:link" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                                                            {linkButtonLabel}
                                                        </button>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <!-- View All card (dashed, like Add Floor) -->
                                        <div class="dpm-pbcard dpm-pbcard-viewall" onclick={handlePricingBack}>
                                            <div class="dpm-viewall-inner">
                                                <lightning-icon icon-name="utility:rows" size="small" class="dpm-viewall-ic"></lightning-icon>
                                                <span class="dpm-viewall-label">View All {selectedPricebookTypeLabel}</span>
                                            </div>
                                        </div>
                                    </div>
                                <div class="dpm-inline-detail dpm-anim-fade">
                                    <div class="dpm-inline-detail-bar">
                                        <div class="dpm-inline-detail-actions">
                                            <div class="dpm-entry-search-wrap">
                                                <lightning-icon icon-name="utility:search" size="xx-small" class="dpm-entry-search-icon"></lightning-icon>
                                                <input type="text"
                                                    class="dpm-entry-search-input"
                                                    placeholder="Filter products..."
                                                    value={entrySearch}
                                                    oninput={handleEntrySearch} />
                                                <template lwc:if={entrySearch}>
                                                    <button class="dpm-entry-search-clear" onclick={handleClearEntrySearch} title="Clear">&times;</button>
                                                </template>
                                            </div>
                                            <div class="dpm-col-toggle-wrap">
                                                <button class="cpb-btn cpb-btn_neutral dpm-col-toggle-btn" onclick={handleToggleColumnMenu} title="Show/hide columns">
                                                    <lightning-icon icon-name="utility:table" size="x-small" class="cpb-btn-icon"></lightning-icon>
                                                    Columns
                                                </button>
                                                <template lwc:if={showColumnMenu}>
                                                    <div class="dpm-col-menu">
                                                        <template for:each={columnMenuOptions} for:item="col">
                                                            <button key={col.fieldKey} class="dpm-col-menu-item" data-key={col.key} onclick={handleToggleColumn}>
                                                                <span class={col.tickCls}>&#10003;</span>
                                                                {col.label}
                                                            </button>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                            <button class="dpm-icon-btn dpm-toolbar-btn" onclick={handleExportEntries} title="Export as CSV (includes pricing tiers)">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v8m0 0l-3-3m3 3l3-3"/><path d="M2 12v2h12v-2"/></svg>
                                            </button>
                                            <button class="dpm-icon-btn dpm-toolbar-btn" onclick={handleOpenImport} title="Import Pricing Tiers (CSV)">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 10V2m0 0l-3 3m3-3l3 3"/><path d="M2 12v2h12v-2"/></svg>
                                            </button>
                                            <button class="dpm-icon-btn dpm-toolbar-btn" data-id={selectedPricebook.id} onclick={handleOpenPricebook} title="Open Pricebook">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M7 2H2v12h12V9"/><path d="M9 1h6v6"/><path d="M15 1L8 8"/></svg>
                                            </button>
                                            <button class="dpm-icon-btn dpm-toolbar-btn" onclick={handleToggleAddProducts} title="Add Products to Pricebook">
                                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Add products panel -->
                                    <template lwc:if={showAddProductsPanel}>
                                        <div class="dpm-add-panel">
                                            <div class="dpm-add-panel-head">
                                                <span class="dpm-add-panel-title">Add Products to Pricebook</span>
                                                <button class="dpm-add-panel-close" onclick={handleToggleAddProducts}>&times;</button>
                                            </div>
                                            <div class="dpm-lookup-wrap">
                                                <lightning-icon icon-name="utility:search" size="x-small" class="dpm-lookup-icon"></lightning-icon>
                                                <input type="text" class="dpm-lookup-input"
                                                    placeholder="Search products by name or code..."
                                                    value={addProdSearch} oninput={handleAddProdSearch} />
                                            </div>
                                            <template lwc:if={showAddProdDrop}>
                                                <div class="dpm-lookup-results">
                                                    <template for:each={addProdResults} for:item="p">
                                                        <button key={p.id} class="dpm-lookup-result-item" data-id={p.id} onclick={handleAddProdSelect}>
                                                            <span class="dpm-lookup-result-name">{p.name}</span>
                                                            <template lwc:if={p.productCode}>
                                                                <span class="dpm-lookup-result-sub dpm-code-text">{p.productCode}</span>
                                                            </template>
                                                        </button>
                                                    </template>
                                                    <template lwc:if={showAddProdCreateNew}>
                                                        <button class="dpm-lookup-result-item dpm-add-panel-create" onclick={handleNewProductFromAddPanel}>
                                                            <span class="dpm-lookup-result-name">+ Create New Product</span>
                                                            <span class="dpm-lookup-result-sub">No matches for "{addProdSearch}"</span>
                                                        </button>
                                                    </template>
                                                </div>
                                            </template>
                                            <div class="dpm-add-panel-currency">
                                                <label class="dpm-add-panel-currency-label">Currency</label>
                                                <lightning-combobox
                                                    value={addProdCurrency}
                                                    options={currencyOptions}
                                                    variant="label-hidden"
                                                    onchange={handleAddProdCurrencyChange}
                                                    class="dpm-add-panel-currency-picker"
                                                ></lightning-combobox>
                                            </div>
                                            <template lwc:if={hasAddProdSelections}>
                                                <div class="dpm-add-panel-table-wrap">
                                                    <table class="dpm-add-panel-tbl">
                                                        <thead><tr>
                                                            <th>Product</th>
                                                            <th class="dpm-add-panel-th-price">List Price ({addProdCurrency})</th>
                                                            <th class="dpm-add-panel-th-action"></th>
                                                        </tr></thead>
                                                        <tbody>
                                                            <template for:each={addProdSelections} for:item="p">
                                                                <tr key={p.id}>
                                                                    <td>
                                                                        <span class="dpm-add-panel-prod-name">{p.name}</span>
                                                                        <template lwc:if={p.code}>
                                                                            <span class="dpm-code-text">{p.code}</span>
                                                                        </template>
                                                                    </td>
                                                                    <td class="dpm-add-panel-td-price">
                                                                        <input type="number" class="dpm-price-input" value={p.unitPrice}
                                                                            data-id={p.id} onchange={handleAddProdPriceChange}
                                                                            min="0" step="0.01" />
                                                                    </td>
                                                                    <td class="dpm-add-panel-td-action">
                                                                        <button class="dpm-icon-btn" data-id={p.id} onclick={handleRemoveAddProd} title="Remove">
                                                                            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                                                                        </button>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                                <div class="dpm-add-panel-foot">
                                                    <button class="cpb-btn cpb-btn_brand" disabled={isAddingProducts} onclick={handleCommitAddProducts}>
                                                        {addProductsButtonLabel}
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- Mass update toolbar -->
                                    <template lwc:if={hasMassSelection}>
                                        <div class="dpm-mass-update-bar">
                                            <span class="dpm-mass-count">{selectedEntryCount} selected</span>
                                            <input
                                                type="number"
                                                class="dpm-price-input dpm-mass-price"
                                                placeholder="New price..."
                                                value={massUpdatePrice}
                                                onchange={handleMassUpdatePriceChange}
                                                min="0" step="0.01" />
                                            <button class="cpb-btn cpb-btn_brand" disabled={_massUpdating} onclick={handleConfirmMassUpdate}>
                                                {massUpdateButtonLabel}
                                            </button>
                                            <button class="cpb-btn cpb-btn_neutral" onclick={handleCancelMassUpdate}>Cancel</button>
                                        </div>
                                    </template>

                                    <template lwc:if={entriesLoading}>
                                        <div class="dpm-loading">
                                            <lightning-spinner size="small" alternative-text="Loading entries..."></lightning-spinner>
                                        </div>
                                    </template>

                                    <template lwc:else>
                                        <template lwc:if={hasFilteredEntries}>
                                            <div class="dpm-inline-tbl-wrap">
                                                <table class="dpm-entry-table dpm-inline-tbl">
                                                    <thead>
                                                        <tr>
                                                            <th scope="col" class="dpm-col-row-num"></th>
                                                            <th scope="col" class="dpm-col-check">
                                                                <input type="checkbox" class="dpm-check" checked={allEntriesSelected} onchange={handleSelectAllEntries} title="Select all" />
                                                            </th>
                                                            <th scope="col">Product</th>
                                                            <template lwc:if={showColCode}>
                                                                <th scope="col" class="dpm-col-code">Code</th>
                                                            </template>
                                                            <template lwc:if={showColChargeType}>
                                                                <th scope="col" class="dpm-col-charge">Type</th>
                                                            </template>
                                                            <template lwc:if={showColFamily}>
                                                                <th scope="col" class="dpm-col-fam">Family</th>
                                                            </template>
                                                            <th scope="col" class="dpm-col-price dpm-th-right">List Price</th>
                                                            <template lwc:if={showColCurrency}>
                                                                <th scope="col" class="dpm-col-curr">Ccy</th>
                                                            </template>
                                                            <template lwc:if={showColStatus}>
                                                                <th scope="col" class="dpm-col-status-sm">Status</th>
                                                            </template>
                                                            <th scope="col" class="dpm-col-actions-wide"></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template for:each={displayList} for:item="entry">
                                                            <template lwc:if={entry.showGroupHeader}>
                                                                <tr key={entry.groupHeaderLabel} class="dpm-group-header-row" data-group={entry.groupHeaderLabel} onclick={handleToggleGroup}>
                                                                    <td colspan="20" class="dpm-group-header-cell">
                                                                        <template lwc:if={entry.groupOpen}>
                                                                            <span class="dpm-group-chevron">&#9660;</span>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <span class="dpm-group-chevron">&#9654;</span>
                                                                        </template>
                                                                        <span class="dpm-group-header-label">{entry.groupHeaderDisplay}</span>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                            <template lwc:if={entry.groupOpen}>
                                                            <tr key={entry.id} class="dpm-entry-row" onmouseenter={handleEntryRowEnter} onmouseleave={handleEntryRowLeave}>
                                                                <td class="dpm-row-num-cell" data-id={entry.id} onclick={handleEntryEye}>
                                                                    <span class="dpm-row-num">{entry.rowNum}</span>
                                                                    <span class="dpm-row-eye-wrap">
                                                                        <lightning-icon icon-name="utility:preview" size="xx-small" alternative-text="View detail"></lightning-icon>
                                                                    </span>
                                                                </td>
                                                                <td class="dpm-col-check">
                                                                    <input type="checkbox" class="dpm-check" checked={entry.isSelected} data-id={entry.id} onchange={handleEntryToggleSelect} />
                                                                </td>
                                                                <td data-label="Product">
                                                                    <div class="dpm-product-cell" data-id={entry.id} onclick={handleEntryKvaToggle}>
                                                                        <span class="dpm-cell-primary">{entry.productName}</span>
                                                                        <template lwc:if={entry.hasKvaTiers}>
                                                                            <span class={entry.kvaExpandCls}>&#9654;</span>
                                                                        </template>
                                                                    </div>
                                                                    <template lwc:if={entry.hasKvaTiers}>
                                                                        <button class="dpm-tier-toggle" data-id={entry.id} onclick={handleEntryKvaToggle} title="Show attribute pricing">
                                                                            <template lwc:if={entry.kvaOpen}>&#9660;</template>
                                                                            <template lwc:else>&#9654;</template>
                                                                            <span class="dpm-tier-toggle-label">{entry.kvaTiers.length} tiers</span>
                                                                        </button>
                                                                    </template>
                                                                    <template lwc:if={entry.showCcyToggle}>
                                                                        <button class="dpm-ccy-toggle" data-id={entry.id} onclick={handleToggleCcyRows} title="Show prices in other currencies">
                                                                            <template lwc:if={entry.isCcyExpanded}>&#9660;</template>
                                                                            <template lwc:else>&#9654;</template>
                                                                            <span class="dpm-ccy-toggle-label">{entry.currencySubRows.length} currencies</span>
                                                                        </button>
                                                                        <template lwc:if={entry.isCcyExpanded}>
                                                                            <button class="dpm-add-ccy-btn" data-id={entry.productId} onclick={handleOpenAddCurrency} title="Add currency price">+ Add Currency</button>
                                                                        </template>
                                                                    </template>
                                                                    <template lwc:if={entry.hasCountryBadges}>
                                                                        <div class="dpm-country-badges">
                                                                            <template for:each={entry.countryBadges} for:item="cb">
                                                                                <span key={cb.key} class="dpm-country-badge">{cb.label}</span>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                                <template lwc:if={showColCode}>
                                                                    <td data-label="Code" class="dpm-col-code">
                                                                        <span class="dpm-code-text">{entry.productCode}</span>
                                                                    </td>
                                                                </template>
                                                                <template lwc:if={showColChargeType}>
                                                                    <td data-label="Type" class="dpm-col-charge">
                                                                        <template lwc:if={entry.hasChargeType}>
                                                                            <span class={entry.chargeTypeBadge}>{entry.chargeTypeLabel}</span>
                                                                        </template>
                                                                        <template lwc:else>
                                                                            <span class="dpm-charge-badge dpm-charge-none">—</span>
                                                                        </template>
                                                                    </td>
                                                                </template>
                                                                <template lwc:if={showColFamily}>
                                                                    <td data-label="Family" class="dpm-col-fam">{entry.familyLabel}</td>
                                                                </template>
                                                                <td data-label="Price" class="dpm-col-price dpm-td-right dpm-price-cell" data-id={entry.id} onclick={handleEntryEditPrice}>
                                                                    <template lwc:if={entry.isEditing}>
                                                                        <input
                                                                            type="number"
                                                                            class="dpm-price-input"
                                                                            value={entry.draftPrice}
                                                                            data-id={entry.id}
                                                                            onchange={handleDraftPriceChange}
                                                                            onkeydown={handlePriceKeydown}
                                                                            min="0" step="0.01" />
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <div class="dpm-price-view">
                                                                            <span class={entry.priceTextClass}>{entry.unitPriceFormatted}</span>
                                                                            <span class="dpm-price-edit-hint">
                                                                                <lightning-icon icon-name="utility:edit" size="xx-small" class="dpm-price-edit-icon"></lightning-icon>
                                                                            </span>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                                <template lwc:if={showColCurrency}>
                                                                    <td data-label="Ccy" class="dpm-col-curr">{entry.currencyIsoCode}</td>
                                                                </template>
                                                                <template lwc:if={showColStatus}>
                                                                    <td data-label="Status" class="dpm-col-status-sm">
                                                                        <span class={entry.statusPillClass}>{entry.activeLabel}</span>
                                                                    </td>
                                                                </template>
                                                                <td class="dpm-col-actions-wide">
                                                                    <template lwc:if={entry.confirmDelete}>
                                                                        <span class="dpm-delete-confirm">
                                                                            Remove?&nbsp;
                                                                            <button class="dpm-confirm-yes" data-id={entry.id} onclick={handleConfirmDeleteEntry}>Yes</button>
                                                                            &nbsp;
                                                                            <button class="dpm-confirm-no" onclick={handleCancelDeleteEntry}>No</button>
                                                                        </span>
                                                                    </template>
                                                                    <template lwc:elseif={entry.isEditing}>
                                                                        <div class="dpm-row-actions dpm-row-actions_editing">
                                                                            <button class="dpm-action-save" disabled={entry.isSaving} data-id={entry.id} onclick={handleSaveEntryPrice}>Save</button>
                                                                            <button class="dpm-action-cancel" onclick={handleCancelEntryEdit}>Cancel</button>
                                                                        </div>
                                                                    </template>
                                                                    <template lwc:else>
                                                                        <div class="dpm-row-actions">
                                                                            <button class="dpm-icon-btn" data-id={entry.id} onclick={handleEntryEditPrice} title="Edit Price">
                                                                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3L5 14H2v-3z"/></svg>
                                                                            </button>
                                                                            <button class="dpm-icon-btn" data-id={entry.id} onclick={handleEntryEye} title="View Details">
                                                                                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z"/><circle cx="8" cy="8" r="2"/></svg>
                                                                            </button>
                                                                            <template lwc:if={entry.isActive}>
                                                                                <button class="dpm-icon-btn dpm-icon-btn-warn" data-id={entry.id} data-active={entry.isActive} onclick={handleToggleEntryActive} title={entry.toggleTitle} disabled={entry.isToggling}>
                                                                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 5v3"/><circle cx="8" cy="11" r="0.5" fill="currentColor"/></svg>
                                                                                </button>
                                                                            </template>
                                                                            <template lwc:else>
                                                                                <button class="dpm-icon-btn dpm-icon-btn-success" data-id={entry.id} data-active={entry.isActive} onclick={handleToggleEntryActive} title={entry.toggleTitle} disabled={entry.isToggling}>
                                                                                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 8.5l3.5 3.5L13 4"/></svg>
                                                                                </button>
                                                                            </template>
                                                                            <button
                                                                                class="dpm-minus-btn"
                                                                                disabled={entry.isDeleting}
                                                                                data-id={entry.id}
                                                                                onclick={handleDeleteEntry}
                                                                                title="Remove Entry">&#8722;</button>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                            <!-- Tier sub-rows removed: full-width tier table shows on kvaOpen -->
                                                            <template lwc:if={entry.hasKvaTiers}>
                                                                <template lwc:if={entry.kvaOpen}>
                                                                    <tr key={entry.kvaTableKey} class="dpm-tier-expand-row">
                                                                        <td colspan="20" class="dpm-tier-expand-cell">
                                                                            <div class="dpm-tier-wrap">
                                                                                <!-- Toolbar: site pills (only if tiers exist) + Add button -->
                                                                                <div class="dpm-tier-toolbar">
                                                                                    <template lwc:if={entry.hasTierSubRows}>
                                                                                        <template lwc:if={entry.hasTierSites}>
                                                                                            <div class="dpm-tier-site-pills">
                                                                                                <template for:each={entry.tierSites} for:item="sp">
                                                                                                    <span key={sp.key} class="dpm-tier-site-pill">{sp.label}</span>
                                                                                                </template>
                                                                                            </div>
                                                                                        </template>
                                                                                    </template>
                                                                                    <template lwc:else>
                                                                                        <span class="dpm-tier-empty-hint">No pricing tiers yet for this site</span>
                                                                                    </template>
                                                                                    <button class="dpm-tier-add-btn" data-code={entry.productCode} onclick={handleOpenCreateTier} title="Add pricing tier">+ Add Price</button>
                                                                                </div>
                                                                                <!-- kVA: multi-currency table -->
                                                                                <template lwc:if={entry.isKvaTierMultiCcy}>
                                                                                    <div class="dpm-tier-scroll">
                                                                                        <table class="dpm-tier-tbl dpm-tier-tbl-wide">
                                                                                            <thead>
                                                                                                <tr>
                                                                                                    <th class="dpm-tier-th-attr">Attribute</th>
                                                                                                    <th class="dpm-tier-th-ccy">USD</th>
                                                                                                    <th class="dpm-tier-th-ccy">JPY</th>
                                                                                                    <th class="dpm-tier-th-ccy">SGD</th>
                                                                                                    <th class="dpm-tier-th-ccy">HKD</th>
                                                                                                    <th class="dpm-tier-th-ccy">IDR</th>
                                                                                                    <th class="dpm-tier-th-ccy">KRW</th>
                                                                                                    <th class="dpm-tier-th-ccy">CNY</th>
                                                                                                    <th class="dpm-tier-th-ccy">PHP</th>
                                                                                                    <th class="dpm-tier-th-action"></th>
                                                                                                </tr>
                                                                                            </thead>
                                                                                            <tbody>
                                                                                                <template for:each={entry.kvaTiers} for:item="kv">
                                                                                                    <tr key={kv.key} class="dpm-tier-row">
                                                                                                        <td class="dpm-tier-attr-cell"><span class="dpm-tier-badge">{kv.attrLabel}</span></td>
