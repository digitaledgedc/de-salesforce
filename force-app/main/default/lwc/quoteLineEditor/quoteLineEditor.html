                                                type="number" label="Price" value={cell.unitPrice} min="0" step="0.01"
                                                data-phase-id={cell.phaseId} data-line-id={cell.lineId} data-field="unitPrice"
                                                onchange={handleRampModalProdChange}
                                                variant="label-hidden"
                                                placeholder="Price"
                                                class="qle-ramp-grid-input"
                                            ></lightning-input>
                                            <!-- Phase actions: link + exclude -->
                                            <template lwc:if={cell.canExclude}>
                                                <div class="qle-ramp-phase-actions">
                                                    <template lwc:if={cell.isLinkable}>
                                                        <div class="qle-ramp-pill-wrap">
                                                            <button class={cell.pillClass}
                                                                    data-phase-id={cell.phaseId} data-line-id={cell.lineId}
                                                                    disabled={cell.linkLocked} title={cell.pillTitle}
                                                                    onclick={handlePillClick}>{cell.pillLabel}</button>
                                                            <template lwc:if={cell.showPillMenu}>
                                                                <!-- Multi-select stays open while toggling — this catches the outside click -->
                                                                <div class="qle-ramp-pill-backdrop" onclick={handlePillMenuClose}></div>
                                                                <div class="qle-ramp-pill-menu" style={cell.pillMenuStyle}>
                                                                    <template for:each={cell.pillOptions} for:item="po">
                                                                        <button key={po.value} class={po.cls}
                                                                                data-phase-id={cell.phaseId} data-line-id={cell.lineId}
                                                                                data-target={po.value}
                                                                                onclick={handlePillSelect}><span class="qle-ramp-pill-mark">{po.mark}</span>{po.label}</button>
                                                                    </template>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <button class="qle-ramp-exclude-btn"
                                                            data-phase-id={cell.phaseId} data-line-id={cell.lineId}
                                                            onclick={handleExcludeToggle} title="Exclude from this phase">&#x2715;</button>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                </template>
                                <!-- Connector track row -->
                                <div key={row.trackKey} class="qle-ramp-track-corner" style={row.trackStyle}></div>
                                <template for:each={row.trackCells} for:item="tc">
                                    <div key={tc.key} class={tc.cls} style={tc.cellStyle}>
                                        <template lwc:if={tc.hasNode}>
                                            <div class={tc.nodeClass}></div>
                                            <div class="qle-ramp-track-leg"></div>
                                        </template>
                                        <template for:each={tc.lines} for:item="ln">
                                            <div key={ln.key} class="qle-ramp-track-hline" style={ln.style}></div>
                                        </template>
                                    </div>
                                </template>
                            </template>
                        </div>

                        <!-- Inline validation -->
                        <template lwc:if={hasRampValidationErrors}>
                            <div class="qle-ramp-validation">
                                <lightning-icon icon-name="utility:warning" size="xx-small" class="qle-ramp-validation-ic"></lightning-icon>
                                <div class="qle-ramp-validation-list">
                                    <template for:each={_rampValidationMessages} for:item="msg">
                                        <span key={msg.key} class="qle-ramp-validation-msg">{msg.text}</span>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Error display -->
                    <template lwc:if={_rampModalError}>
                        <div class="qle-ramp-modal-error">
                            <lightning-icon icon-name="utility:error" size="x-small" variant="error"></lightning-icon>
                            <span>{_rampModalError}</span>
                        </div>
                    </template>

                    <!-- Footer -->
                    <div class="qle-ramp-modal-footer">
                        <span class="qle-ramp-modal-footer-info">{rampModalProductCount} products &middot; {_rampModalPhaseCount} phases</span>
                        <lightning-button label="Cancel" onclick={handleCloseRampModal}></lightning-button>
                        <lightning-button label={rampModalSaveLabel} variant="brand"
                                          onclick={handleSaveRampModal}
                                          disabled={rampModalSaveDisabled}></lightning-button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>
