<!-- recordFileUpload.html -->
<template>
    <div class="su-root">

        <!-- ══ TOP BAR ══ -->
        <div class="su-topbar">
            <div class="su-topbar-left">
                <div class="su-logo-ring">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/>
                    </svg>
                </div>
                <div>
                    <h2 class="su-topbar-title">{cardTitle}</h2>
                </div>
            </div>
            <div class="su-topbar-actions">
                <button class="su-btn-primary" type="button" onclick={triggerFilePicker}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <polyline points="16 16 12 12 8 16"></polyline>
                        <line x1="12" y1="12" x2="12" y2="21"></line>
                        <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"></path>
                    </svg>
                    Upload File
                </button>
            </div>
        </div>

        <!-- Hidden file input — triggered by the Upload File button -->
        <input type="file" multiple
               class="hidden-input" data-id="fileInput"
               onchange={handleFileInputChange} />

        <!-- ══ DRAG & DROP ZONE ══ -->
        <div class={dropZoneClass}
             ondragover={handleDragOver}
             ondragleave={handleDragLeave}
             ondrop={handleDrop}
             onclick={triggerFilePicker}>
            <div class="dz-inner">
                <div class="dz-icon-ring">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <polyline points="16 16 12 12 8 16"></polyline>
                        <line x1="12" y1="12" x2="12" y2="21"></line>
                        <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"></path>
                    </svg>
                </div>
                <p class="dz-headline">
                    <template if:true={isDragging}>Drop to upload</template>
                    <template if:false={isDragging}>Drag &amp; drop files here</template>
                </p>
                <p class="dz-caption">Any file type accepted &mdash; or click to browse</p>
                <button class="dz-browse-btn" type="button" aria-label="Browse files">Browse Files</button>
            </div>
        </div>

        <!-- ══ DOCUMENTS SECTION ══ -->
        <div class="su-docs-section">

            <div class="su-docs-header">
                <div class="su-docs-header-left">
                    <span class="su-section-label">Uploaded Documents</span>
                    <template if:true={hasDocuments}>
                        <span class="su-count-badge">{existingDocuments.length}</span>
                    </template>
                </div>
                <button class="su-refresh-btn" type="button" onclick={refreshDocuments} title="Refresh" aria-label="Refresh documents">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>

            <!-- Loading skeletons -->
            <template if:true={isLoadingDocs}>
                <div class="su-loading-wrap">
                    <div class="su-skeleton-row"></div>
                    <div class="su-skeleton-row"></div>
                    <div class="su-skeleton-row su-skeleton-row--short"></div>
                </div>
            </template>

            <template if:false={isLoadingDocs}>

                <!-- Documents table -->
                <template if:true={hasDocuments}>
                    <div class="su-doc-table">

                        <!-- ── HEADER ROW — uses su-hdr-cell (span, no flex) ── -->
                        <div class="su-doc-table-hdr">
                            <span class="su-hdr-cell">File Name</span>
                            <span class="su-hdr-cell">Doc Type</span>
                            <span class="su-hdr-cell su-hdr-date">Date</span>
                            <span class="su-hdr-cell su-hdr-size">Size</span>
                            <span class="su-hdr-cell su-hdr-cell--actions">Actions</span>
                        </div>

                        <!-- ── DATA ROWS — uses su-cell (div, flex) ── -->
                        <template for:each={existingDocuments} for:item="doc">
                            <div key={doc.contentDocumentId} class="su-doc-row">

                                <!-- File Name — icon + clickable link -->
                                <div class="su-cell su-cell--name">
                                    <div class={doc.extIconClass}>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                            <polyline points="14 2 14 8 20 8"/>
                                        </svg>
                                    </div>
                                    <a href={doc.downloadUrl}
                                       target="_blank"
                                       class="su-doc-filename"
                                       title={doc.fileName}>{doc.fileName}</a>
                                </div>

                                <!-- Doc Type -->
                                <div class="su-cell su-cell--type">
                                    <span class="su-doc-type-pill">{doc.docType}</span>
                                </div>

                                <!-- Date -->
                                <div class="su-cell su-cell--date">
                                    <span class="su-doc-meta">{doc.lastModifiedDate}</span>
                                </div>

                                <!-- Size -->
                                <div class="su-cell su-cell--size">
                                    <span class="su-doc-meta">{doc.fileSizeFormatted}</span>
                                </div>

                                <!-- Actions -->
                                <div class="su-cell su-cell--actions">
                                    <a href={doc.downloadUrl}
                                       target="_blank"
                                       class="su-action-btn su-action-btn--download"
                                       title="Download">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                            <polyline points="7 10 12 15 17 10"/>
                                            <line x1="12" y1="15" x2="12" y2="3"/>
                                        </svg>
                                    </a>
                                    <template if:true={userCanManage}>
                                        <button class="su-action-btn su-action-btn--delete"
                                                type="button"
                                                title="Delete"
                                                aria-label="Delete document"
                                                data-id={doc.contentDocumentId}
                                                data-name={doc.fileName}
                                                onclick={openDeleteConfirm}>
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="3 6 5 6 21 6"/>
                                                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                                                <path d="M10 11v6M14 11v6"/>
                                                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                                            </svg>
                                        </button>
                                    </template>
                                </div>

                            </div>
                        </template>

                    </div>
                </template>

                <!-- Empty state -->
                <template if:false={hasDocuments}>
                    <div class="su-empty-state">
                        <div class="su-empty-icon">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="9" y1="13" x2="15" y2="13"/>
                                <line x1="9" y1="17" x2="12" y2="17"/>
                            </svg>
                        </div>
                        <p class="su-empty-text">No documents uploaded yet</p>
                        <p class="su-empty-sub">Upload a file above to get started</p>
                    </div>
                </template>

            </template>
        </div>

    </div>

    <!-- ══════════════════════════════════════════════════════
         UPLOAD MODAL
    ══════════════════════════════════════════════════════ -->
    <template if:true={showUploadModal}>
        <div class="su-overlay" onclick={handleUploadBackdrop}>
            <div class="su-modal" onclick={stopProp}>

                <!-- Header -->
                <div class="su-modal-header">
                    <div class="su-modal-header-inner">
                        <div class="su-modal-icon-badge">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="su-modal-title">Upload Document</h3>
                            <p class="su-modal-subtitle">Select a document type then save</p>
                        </div>
                    </div>
                    <button class="su-modal-x" type="button" aria-label="Close upload modal" onclick={closeUploadModal}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Split body -->
                <div class="su-modal-body">

                    <!-- LEFT: doc type picker -->
                    <div class="su-panel-left">
                        <div class="su-panel-left-hdr">
                            <span class="su-panel-label">Document Type</span>
                            <template if:true={userCanManage}>
                                <button class="su-add-inline-btn" type="button" aria-label="Add document type" onclick={toggleInlineAddForm}>
                                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Add Type
                                </button>
                            </template>
                        </div>

                        <!-- Inline add form -->
                        <template if:true={showInlineAddForm}>
                            <div class="su-inline-add-form">
                                <span class="su-inline-add-label">New Type Name</span>
                                <input class="su-inline-add-input"
                                       type="text"
                                       aria-label="New document type name"
                                       placeholder="e.g. Cabinet Proposal, MSA, SOW…"
                                       value={newDocTypeName}
                                       onchange={handleNewTypeName}
                                       onkeyup={handleNewTypeKeyup} />
                                <div class="su-inline-add-actions">
                                    <button class="su-inline-cancel-btn" type="button" onclick={toggleInlineAddForm}>Cancel</button>
                                    <button class="su-inline-save-btn" type="button"
                                            disabled={isSavingDocType}
                                            onclick={saveNewDocType}>
                                        <template if:true={isSavingDocType}>Saving…</template>
                                        <template if:false={isSavingDocType}>Save</template>
                                    </button>
                                </div>
                            </div>
                        </template>

                        <!-- Doc type list -->
                        <div class="su-doctype-list">
                            <template for:each={docTypeListItems} for:item="item">
                                <button key={item.value}
                                        type="button"
                                        class={item.itemClass}
                                        aria-label={item.label}
                                        data-value={item.value}
                                        onclick={handleDocTypeSelect}>
                                    <span class="su-dt-indicator">
                                        <template if:true={item.isSelected}>
                                            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        </template>
                                    </span>
                                    <span class="su-dt-name">{item.label}</span>
                                </button>
                            </template>
                            <template if:true={noDocTypes}>
                                <div class="su-no-doctypes">
                                    <p>No document types yet.</p>
                                    <button type="button" class="su-link-btn" onclick={toggleInlineAddForm}>+ Add one now</button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- RIGHT: file confirmation -->
                    <div class="su-panel-right">
                        <template if:true={activeFile}>

                            <!-- All staged files — always shown when multiple, so users can
                                 switch between files without losing visibility of the list -->
                            <template if:true={hasMultipleFiles}>
                                <div>
                                    <p class="su-right-section-label">All Staged ({stagedFiles.length}) — click to switch</p>
                                    <div class="su-staged-list">
                                        <template for:each={stagedFiles} for:item="sf" for:index="idx">
                                            <div key={sf.clientId} class={sf.rowClass} data-idx={idx} onclick={switchActiveFile}>
                                                <span class="su-staged-name">{sf.fileName}</span>
                                                <span class="su-staged-type">{sf.docType}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:false={activeFile.docType}>
                                <div class="su-right-empty">
                                    <div class="su-right-empty-icon">
                                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <line x1="19" y1="12" x2="5" y2="12"/>
                                            <polyline points="12 19 5 12 12 5"/>
                                        </svg>
                                    </div>
                                    <p>Select a type for <strong>{activeFile.fileName}</strong></p>
                                </div>
                            </template>

                            <template if:true={activeFile.docType}>
                                <div class="su-right-fields">

                                    <div>
                                        <p class="su-right-section-label">File</p>
                                        <div class="su-file-strip">
                                            <div class="su-file-strip-icon">
                                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                                                    <polyline points="14 2 14 8 20 8"/>
                                                </svg>
                                            </div>
                                            <span class="su-file-strip-name">{activeFile.fileName}</span>
                                            <span class="su-file-strip-badge">{activeFile.docType}</span>
                                        </div>
                                    </div>

                                    <div>
                                        <p class="su-right-section-label">Confirmation</p>
                                        <div class="su-confirm-card">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/>
                                                <polyline points="22 4 12 14.01 9 11.01"/>
                                            </svg>
                                            <div>
                                                <p class="su-confirm-title">Ready to upload</p>
                                                <p class="su-confirm-sub">Document Type: <strong>{activeFile.docType}</strong></p>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </template>

                        </template>
                        <template if:false={activeFile}>
                            <div class="su-right-empty"><p>No file staged.</p></div>
                        </template>
                    </div>

                </div>

                <!-- Footer -->
                <div class="su-modal-footer">
                    <span class="su-footer-note">
                        <template if:true={stagedFiles.length}>
                            <div class="su-dot-pulse"></div>
                            {stagedFiles.length} file(s) ready to upload
                        </template>
                    </span>
                    <div class="su-footer-btns">
                        <button class="su-btn-ghost" type="button" onclick={closeUploadModal}>Cancel</button>
                        <button class="su-btn-primary" type="button" disabled={isSaving} onclick={saveAndUpload}>
                            <template if:true={isSaving}>
                                <span class="su-spinner"></span> Uploading…
                            </template>
                            <template if:false={isSaving}>
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                                Save &amp; Upload
                            </template>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════
         DELETE CONFIRM MODAL
    ══════════════════════════════════════════════════════ -->
    <template if:true={showDeleteModal}>
        <div class="su-overlay" onclick={closeDeleteConfirm}>
            <div class="su-modal su-modal--sm" onclick={stopProp}>

                <div class="su-modal-header su-modal-header--danger">
                    <div class="su-modal-header-inner">
                        <div class="su-modal-icon-badge">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                                <path d="M10 11v6M14 11v6"/>
                                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="su-modal-title">Delete Document</h3>
                            <p class="su-modal-subtitle">This action cannot be undone</p>
                        </div>
                    </div>
                    <button class="su-modal-x" type="button" aria-label="Close delete modal" onclick={closeDeleteConfirm}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="su-delete-body">
                    <div class="su-delete-file-card">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span>{deleteTargetName}</span>
                    </div>
                    <p class="su-delete-warn">Are you sure you want to permanently delete this document? It will be removed from Salesforce Files.</p>
                </div>

                <div class="su-modal-footer">
                    <span></span>
                    <div class="su-footer-btns">
                        <button class="su-btn-ghost" type="button" onclick={closeDeleteConfirm}>Cancel</button>
                        <button class="su-btn-danger" type="button" disabled={isDeleting} onclick={confirmDelete}>
                            <template if:true={isDeleting}>
                                <span class="su-spinner"></span> Deleting…
                            </template>
                            <template if:false={isDeleting}>
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                                </svg>
                                Delete
                            </template>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </template>

</template>
