                            <div class="dim-spinner"></div>
                        </div>
                    </template>
                    <template if:false={_assignmentsLoading}>
                        <template if:true={hasAssignments}>
                            <!-- Summary metrics -->
                            <div class="dim-asgn-metrics">
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v">{asgnTotalDemand}</span>
                                    <span class="dim-asgn-metric-l">Demand Lines</span>
                                </div>
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v dim-asgn-fulfilled">{asgnFulfilled}</span>
                                    <span class="dim-asgn-metric-l">Fulfilled</span>
                                </div>
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v dim-asgn-unfulfilled">{asgnUnfulfilled}</span>
                                    <span class="dim-asgn-metric-l">Unfulfilled</span>
                                </div>
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v dim-asgn-spaces">{asgnAvailSpaces}</span>
                                    <span class="dim-asgn-metric-l">Spaces Avail</span>
                                </div>
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v dim-asgn-breakers">{asgnAvailBreakers}</span>
                                    <span class="dim-asgn-metric-l">Breakers Avail</span>
                                </div>
                                <div class="dim-asgn-metric">
                                    <span class="dim-asgn-metric-v">{asgnQuoteCount}</span>
                                    <span class="dim-asgn-metric-l">Active Quotes</span>
                                </div>
                            </div>

                            <!-- Status filter -->
                            <div class="dim-asgn-filter-bar">
                                <span class="dim-asgn-filter-label">Stage</span>
                                <template for:each={asgnStatusPills} for:item="sp">
                                    <button key={sp.value} class={sp.cls}
                                        data-value={sp.value}
                                        onclick={handleAsgnStatusPill}>{sp.label}</button>
                                </template>
                                <div class="dim-card-search-bar dim-asgn-search-bar">
                                    <svg class="dim-card-search-ic" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="4"/><path d="M10 10l3.5 3.5"/></svg>
                                    <input type="text"
                                        class="dim-card-search-input"
                                        placeholder="Search Account or Order..."
                                        oninput={handleAsgnSearch}
                                        value={_asgnSearch} />
                                    <template if:true={hasAsgnSearch}>
                                        <span class="dim-card-search-count">{asgnSearchCount}</span>
                                        <button class="dim-card-search-clear" onclick={clearAsgnSearch}>&times;</button>
                                    </template>
                                </div>
                            </div>

                            <!-- Quote groups -->
                            <template if:true={hasFilteredAssignments}>
                            <template for:each={assignmentGroups} for:item="qg">
                                <div key={qg.quoteId} class="dim-asgn-quote">
                                    <div class="dim-asgn-quote-head" data-key={qg.quoteId} onclick={handleAssgnToggle}>
                                        <div class="dim-asgn-quote-left">
                                            <span class={qg.chevronCls}>&#8250;</span>
                                            <span class="dim-asgn-qnum" data-id={qg.quoteId} onclick={handleQuoteNav}>{qg.quoteNumber}</span>
                                            <span class="dim-asgn-account">{qg.accountName}</span>
                                            <span class={qg.statusCls}>{qg.quoteStatus}</span>
                                        </div>
                                        <div class="dim-asgn-quote-right">
                                            <template if:true={qg.hasRdd}>
                                                <span class="dim-asgn-rdd">RDD: {qg.rdd}</span>
                                            </template>
                                            <span class={qg.fulfillCls}>{qg.fulfillLabel}</span>
                                        </div>
                                    </div>
                                    <template if:true={qg.isOpen}>
                                    <div class="dim-tbl-wrap">
                                        <table class="dim-tbl">
                                            <thead>
                                                <tr>
                                                    <th>Product</th>
                                                    <th class="dim-num-c">Qty</th>
                                                    <th>Reserved</th>
                                                    <th>Space</th>
                                                    <th>Breaker</th>
                                                    <th class="dim-num-c">kVA</th>
                                                    <th class="dim-num-c">CabE</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={qg.lines} for:item="ln">
                                                    <tr key={ln.id} class="dim-row">
                                                        <td>{ln.productName}</td>
                                                        <td class="dim-num-c">{ln.quantity}</td>
                                                        <td><span class={ln.reservedCls}>{ln.reserved}</span></td>
                                                        <td>{ln.spaceName}</td>
                                                        <td>{ln.breakerName}</td>
                                                        <td class="dim-num-c">{ln.powerLabel}</td>
                                                        <td class="dim-num-c">{ln.cabeLabel}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    </template>
                                </div>
                            </template>
                            </template>
                            <template if:false={hasFilteredAssignments}>
                                <p class="dim-det-empty">No quotes match the selected filter.</p>
                            </template>
                        </template>

                        <template if:false={hasAssignments}>
                            <div class="dim-asgn-empty">
                                <svg class="dim-asgn-empty-ic" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M12 11v6M9 14h6"/></svg>
                                <h3 class="dim-asgn-empty-h">No Active Assignments</h3>
                                <p class="dim-asgn-empty-p">No quotes with demand are currently targeting this site.</p>
                            </div>
                        </template>
                    </template>
                </template>

            </template>

        </template>

        <!-- ═══════════════════════════════════════════════
             EXPORT MODAL
             ═══════════════════════════════════════════════ -->
        <template if:true={_showExportModal}>
            <div class="dim-modal-overlay" onclick={handleCloseExport}>
                <div class="dim-modal" onclick={handleModalStop}>
                    <div class="dim-modal-head">
                        <h3 class="dim-modal-title">Export Inventory</h3>
                        <button class="dim-modal-close" onclick={handleCloseExport}>&times;</button>
                    </div>
                    <div class="dim-modal-body dim-modal-body--visible">
                        <template if:true={isExportGlobal}>
                            <p class="dim-modal-desc">Export inventory across all sites. Select countries to filter.</p>
                            <div style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px;">
                                <template for:each={exportCountryPills} for:item="cp">
                                    <button key={cp.value} class={cp.cls} data-value={cp.value} onclick={handleExportCountryToggle}>{cp.label}</button>
                                </template>
                            </div>
                        </template>
                        <template if:false={isExportGlobal}>
                            <p class="dim-modal-desc">Export inventory data for <strong>{selectedSiteCode}</strong> as CSV.</p>
                        </template>
                        <div class="dim-exp-filters">
                            <template if:false={isExportGlobal}>
                                <div class="dim-field">
                                    <label class="dim-label">Data Hall</label>
                                    <select class="dim-select" onchange={handleExpHall}>
                                        <template for:each={exportHallOptions} for:item="opt">
                                            <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                        </template>
                                    </select>
                                </div>
                            </template>
                            <div class="dim-field">
                                <label class="dim-label">Status</label>
                                <select class="dim-select" onchange={handleExpStatus}>
                                    <template for:each={exportStatusOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                            <div class="dim-field">
                                <label class="dim-label">Record Type</label>
                                <select class="dim-select" onchange={handleExpType}>
                                    <template for:each={exportTypeOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                        </div>
                        <p class="dim-export-count">{exportCountText}</p>
                    </div>
                    <div class="dim-modal-foot">
                        <button class="dim-btn" onclick={handleCloseExport}>Cancel</button>
                        <button class="dim-btn dim-btn-primary"
                            onclick={handleExportDownload}
                            disabled={_exportLoading}>
                            <template if:true={_exportLoading}>
                                <div class="dim-spinner dim-spinner-sm dim-spinner-inv dim-btn-ic"></div>
                            </template>
                            <template if:false={_exportLoading}>
                                <svg class="dim-btn-ic" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2h10v-2M8 2v7.5m0 0L5 6.5m3 3L11 6.5"/></svg>
                            </template>
                            Export CSV
                        </button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ═══════════════════════════════════════════════
             IMPORT MODAL (Redesigned: Setup → Upload → Preview → Result)
             ═══════════════════════════════════════════════ -->
        <template if:true={_showImportModal}>
            <div class="dim-modal-overlay" onclick={handleCloseImport}>
                <div class="dim-modal dim-modal-lg" onclick={handleModalStop}>
                    <div class="dim-modal-head">
                        <h3 class="dim-modal-title">Import Inventory — {selectedSiteCode}</h3>
                        <button class="dim-modal-close" onclick={handleCloseImport}>&times;</button>
                    </div>
                    <div class="dim-modal-body">

                        <!-- Step 1: Setup — pick RT + hall -->
                        <template if:true={isImportSetup}>
                            <p class="dim-modal-desc">Select record type and target hall, then download the template or upload your CSV.</p>

                            <div class="dim-field" style="margin-bottom:12px;">
                                <label class="dim-label">Record Type</label>
                                <div style="display:flex; gap:8px;">
                                    <button class={importSpaceBtnCls} data-value="Inventory_Space" onclick={handleImportRTSelect}>Space</button>
                                    <button class={importBreakerBtnCls} data-value="Inventory_Breaker" onclick={handleImportRTSelect}>Breaker</button>
                                </div>
                            </div>

                            <div class="dim-field" style="margin-bottom:12px;">
                                <label class="dim-label">Target Hall</label>
                                <select class="dim-select" value={_importHallId} onchange={handleImportHallSelect}>
                                    <option value="">-- Select Hall --</option>
                                    <template for:each={importHallOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>

                            <button class="dim-btn dim-btn-ghost" onclick={handleDownloadTemplate}
                                    disabled={importSetupIncomplete}>
                                <svg class="dim-ic" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 11v2h10v-2M8 2v8M5 7l3 3 3-3"/></svg>
                                Download Template
                            </button>
                        </template>

                        <!-- Step 2: Upload CSV -->
                        <template if:true={isImportUpload}>
                            <p class="dim-modal-desc">Upload a CSV for <strong>{importRTLabel}</strong> records into <strong>{importHallLabel}</strong>. Leave "Id" blank to create new records, or paste an existing record's Salesforce ID (e.g. from an export) to update it instead. Leave "Inventory ID" blank to auto-generate a name for new records, or fill it in to use your own.</p>
                            <div class={dropZoneCls}
                                ondragover={handleDragOver}
                                ondragleave={handleDragLeave}
                                ondrop={handleDrop}>
                                <svg class="dim-drop-ic" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M12 14V4m0 0l-4 4m4-4l4 4"/></svg>
                                <p class="dim-drop-text">Drop a CSV file here<br/>or click to browse</p>
                                <input type="file" accept=".csv" class="dim-drop-input" onchange={handleFileSelect} />
                            </div>
                        </template>

                        <!-- Step 3: Preview + Validate -->
                        <template if:true={isImportConfirm}>
                            <div class={importNoticeCls}>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4M8 5h.01"/></svg>
                                <span>{importConfirmMsg}</span>
                            </div>
                            <template if:true={hasUnrecognizedHeaders}>
                                <div class="dim-import-notice dim-import-notice-warn" style="margin-bottom:8px;">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5l7 12.5H1z"/><path d="M8 6.5v3.5M8 12h.01"/></svg>
                                    <span>{unrecognizedHeadersText}</span>
                                </div>
                            </template>
                            <template if:true={hasImportValidationErrors}>
                                <div class="dim-import-errors" style="margin-bottom:8px;">
                                    <p class="dim-import-err-title">Validation Errors:</p>
                                    <ul class="dim-import-err-list">
                                        <template for:each={importValidationErrors} for:item="err">
                                            <li key={err}>{err}</li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                            <p class="dim-import-legend">
                                <strong>Id</strong> = existing record's Salesforce ID (blank = create new, filled = update that record).
                                <strong>Inventory ID</strong> = the record's name (blank = auto-generated).
                            </p>
                            <div class="dim-import-preview">
                                <table class="dim-tbl">
                                    <thead>
                                        <tr>
                                            <template for:each={importPreviewHeaders} for:item="h">
                                                <th key={h.key}>{h.label}</th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={importPreviewRows} for:item="row">
                                            <tr key={row.key}>
                                                <template for:each={row.cells} for:item="cell">
                                                    <td key={cell.key} class={cell.cls}>{cell.val}</td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <template if:true={hasMoreImportRows}>
                                    <p class="dim-import-more">and {importRemainingCount} more row(s)...</p>
                                </template>
                            </div>
                        </template>

                        <!-- Step 4: Result -->
                        <template if:true={isImportResult}>
                            <div class="dim-import-summary">
                                <svg class="dim-import-ok-ic" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="M5.5 8l2 2 3.5-3.5"/></svg>
                                <span class="dim-import-ok-text">{importResultSummary}</span>
                            </div>
                            <template if:true={hasImportErrors}>
                                <div class="dim-import-errors">
                                    <p class="dim-import-err-title">Errors:</p>
                                    <ul class="dim-import-err-list">
                                        <template for:each={importResultErrors} for:item="err">
                                            <li key={err}>{err}</li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                            <template if:true={hasRecentIds}>
                                <div style="margin-top:12px;">
                                    <button class="dim-btn dim-btn-ghost" onclick={handleCheckSyncStatus} disabled={_syncStatusLoading}>
                                        <template if:true={_syncStatusLoading}>
                                            <div class="dim-spinner dim-spinner-sm dim-btn-ic"></div>
                                        </template>
                                        Check Odoo Sync Status
                                    </button>
                                    <p class="dim-modal-desc" style="margin-top:4px;">Odoo sync runs in the background after this Salesforce import — it may take a few seconds to complete.</p>
                                    <template if:true={hasSyncStatus}>
                                        <div class={syncStatusCls} style="margin-top:8px;">
                                            <span>{syncStatusText}</span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </template>
                    </div>

                    <div class="dim-modal-foot">
                        <template if:true={isImportSetup}>
                            <button class="dim-btn" onclick={handleCloseImport}>Cancel</button>
                            <button class="dim-btn dim-btn-primary" disabled={importSetupIncomplete} onclick={handleImportNext}>Next</button>
                        </template>
                        <template if:true={isImportUpload}>
                            <button class="dim-btn" onclick={handleImportBackToSetup}>Back</button>
                        </template>
                        <template if:true={isImportConfirm}>
                            <button class="dim-btn" onclick={handleImportBack}>Back</button>
                            <button class="dim-btn dim-btn-primary"
                                onclick={handleImportConfirmBulk}
                                disabled={importConfirmSubmitDisabled}
                                title={importValidationBlockedTitle}>
                                <template if:true={_importLoading}>
                                    <div class="dim-spinner dim-spinner-sm dim-spinner-inv dim-btn-ic"></div>
                                </template>
                                Import {_importRows.length} Records
                            </button>
                        </template>
                        <template if:true={isImportResult}>
                            <template if:true={canDownloadImportResults}>
                                <button class="dim-btn" onclick={handleDownloadResults}>Download Results</button>
                            </template>
                            <button class="dim-btn dim-btn-primary" onclick={handleCloseImport}>Close</button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- ═══════════════════════════════════════════════
             SITE PICKER OVERLAY (from list view buttons)
             ═══════════════════════════════════════════════ -->
        <template if:true={_showSitePicker}>
            <div class="dim-modal-overlay" onclick={handleSitePickerClose}>
                <div class="dim-modal" onclick={handleModalStop}>
                    <div class="dim-modal-head">
                        <h3 class="dim-modal-title">Select Site</h3>
                        <button class="dim-modal-close" onclick={handleSitePickerClose}>&times;</button>
                    </div>
                    <div class="dim-modal-body dim-modal-body--visible">
                        <p class="dim-modal-desc">Choose a site to continue with the inventory tool.</p>
                        <div class="dim-field">
                            <label class="dim-label">Site</label>
                            <select class="dim-select" onchange={handleSitePickerChange}>
                                <option value="">Select a site...</option>
                                <template for:each={sitePickerOptions} for:item="opt">
                                    <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="dim-modal-foot">
                        <button class="dim-btn" onclick={handleSitePickerClose}>Cancel</button>
                        <button class="dim-btn dim-btn-primary"
                            disabled={sitePickerNotReady}
                            onclick={handleSitePickerContinue}>
                            Continue
                        </button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>
